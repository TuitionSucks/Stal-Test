name: Sync equipment database

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build-armors.mjs'
      - 'scripts/build-containers.mjs'
      - '.github/workflows/sync-armors.yml'

concurrency:
  group: sync-equipment-database
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-equipment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calculator
        uses: actions/checkout@v4
        with:
          path: calculator
          fetch-depth: 0

      - name: Checkout official EXBO database
        uses: actions/checkout@v4
        with:
          repository: EXBO-Studio/stalzone-database
          path: stalzone-database

      - name: Build compact equipment databases
        working-directory: calculator
        run: |
          node scripts/build-armors.mjs ../stalzone-database/global/items/armor armors.json
          node scripts/build-containers.mjs ../stalzone-database/global/items/containers ../stalzone-database/global/items/backpacks containers.json

      - name: Commit equipment updates
        working-directory: calculator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add armors.json containers.json
          if git diff --cached --quiet; then
            echo "Equipment databases are already current."
            exit 0
          fi
          git commit -m "Sync equipment database from EXBO"
          git pull --rebase origin main
          git push origin main
